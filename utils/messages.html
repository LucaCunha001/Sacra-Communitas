<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<title>Exportação de mensagens</title>
		<style>
			:root {
				font-family:
					"gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial,
					sans-serif;
				color: var(--text);
				background: var(--background);
				font-synthesis: none;
				text-rendering: optimizeLegibility;
				--background: #09080d;
				--surface: #100e15;
				--surface-raised: #17131e;
				--surface-highest: #211b2b;
				--text: #dcdee5;
				--text-strong: #ffffff;
				--text-subtle: #c5c6ca;
				--muted: #9699a6;
				--line: rgb(174 180 198 / 14%);
				--surface-hover: rgb(174 180 198 / 7%);
				--accent: #8d79bd;
				--sacra-purple: #75609c;
				--sacra-purple-light: #a995d0;
				--sacra-gold: #c9ad79;
				--link: #8ab4ff;
				--mention-background: rgb(88 101 242 / 23.9%);
				--mention-foreground: #cdd7ff;
				--danger: #da3e44;
				--positive: #3d9e60;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-width: 320px;
				min-height: 100vh;
				margin: 0;
				background: var(--background);
			}

			.transcript {
				display: flex;
				width: 100%;
				min-height: 100vh;
				flex-direction: column;
				background: transparent;
			}

			.title-bar {
				position: sticky;
				z-index: 1;
				top: 0;
				display: grid;
				gap: 12px;
				padding: 14px clamp(16px, 4vw, 48px) 12px;
				border-bottom: 1px solid var(--line);
				background: rgb(9 8 13 / 94%);
				backdrop-filter: blur(16px);
			}

			.title-heading {
				display: flex;
				min-width: 0;
				align-items: center;
				gap: 10px;
			}

			.title-icon {
				display: grid;
				width: 34px;
				height: 34px;
				flex: 0 0 34px;
				place-items: center;
				border: 1px solid var(--line);
				border-radius: 11px;
				background: var(--surface-raised);
				color: var(--sacra-gold);
				font-size: 21px;
				font-weight: 600;
			}

			.title-copy {
				display: flex;
				min-width: 0;
				align-items: baseline;
				flex-wrap: wrap;
				gap: 4px 12px;
			}

			#export-title {
				overflow: hidden;
				color: var(--text-strong);
				font-size: 16px;
				font-weight: 650;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			#export-subtitle {
				overflow: hidden;
				color: var(--muted);
				font-size: 12px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.message-tools {
				display: flex;
				min-width: 0;
				align-items: center;
				flex-wrap: wrap;
				gap: 8px;
			}

			.search-box,
			.filter-box {
				display: flex;
				min-height: 38px;
				align-items: center;
				gap: 8px;
				padding: 0 11px;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: var(--surface);
				color: var(--muted);
			}

			.search-box {
				width: min(100%, 360px);
				flex: 0 1 360px;
			}

			.search-icon {
				font-size: 19px;
				line-height: 1;
			}

			#message-search,
			#author-filter {
				min-width: 0;
				border: 0;
				outline: 0;
				background: transparent;
				color: var(--text);
				font: inherit;
				font-size: 13px;
			}

			#message-search {
				width: 100%;
			}

			#message-search::-webkit-search-cancel-button {
				display: none;
			}

			#message-search::placeholder {
				color: var(--muted);
			}

			#author-filter {
				width: 100%;
				cursor: pointer;
			}

			#author-filter option {
				background: var(--surface-raised);
				color: var(--text);
			}

			.search-box:focus-within,
			.filter-box:focus-within {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--sacra-purple) 22%, transparent);
			}

			#clear-search,
			#jump-latest {
				display: inline-flex;
				min-height: 36px;
				align-items: center;
				justify-content: center;
				gap: 6px;
				border: 1px solid var(--line);
				border-radius: 9px;
				background: var(--surface-raised);
				color: var(--text);
				font: inherit;
				font-size: 13px;
				cursor: pointer;
			}

			#clear-search {
				width: 26px;
				min-height: 26px;
				padding: 0;
				border: 0;
				background: transparent;
				font-size: 18px;
			}

			#jump-latest {
				padding: 0 12px;
			}

			#clear-search:hover,
			#jump-latest:not(:disabled):hover {
				border-color: color-mix(in srgb, var(--sacra-purple-light) 55%, transparent);
				background: var(--surface-highest);
			}

			#jump-latest:disabled {
				color: var(--muted);
				cursor: not-allowed;
				opacity: 0.6;
			}

			#clear-search:focus-visible,
			#jump-latest:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}

			.results-count {
				margin-left: auto;
				color: var(--muted);
				font-size: 12px;
				white-space: nowrap;
			}

			.ticket-overview {
				position: relative;
				width: min(calc(100% - 40px), 1080px);
				margin: 22px auto 0;
				overflow: hidden;
				border: 1px solid color-mix(in srgb, var(--sacra-purple) 48%, var(--line));
				border-radius: 14px;
				background: linear-gradient(135deg, rgb(39 30 54 / 74%), rgb(17 14 22 / 96%) 62%);
				box-shadow: 0 12px 36px rgb(0 0 0 / 20%);
			}

			.ticket-overview[hidden] {
				display: none;
			}

			.ticket-overview::before {
				position: absolute;
				inset: 0 auto 0 0;
				width: 3px;
				background: linear-gradient(180deg, var(--sacra-gold), var(--sacra-purple-light));
				content: "";
			}

			.ticket-overview-heading {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 18px 20px 14px;
			}

			.ticket-emblem {
				display: grid;
				width: 42px;
				height: 42px;
				flex: 0 0 42px;
				place-items: center;
				border: 1px solid rgb(201 173 121 / 36%);
				border-radius: 12px;
				background: rgb(201 173 121 / 8%);
				color: var(--sacra-gold);
				font-size: 25px;
				line-height: 1;
			}

			.ticket-heading-copy {
				min-width: 0;
				flex: 1;
			}

			.ticket-kicker {
				margin-bottom: 4px;
				color: var(--sacra-gold);
				font-size: 10px;
				font-weight: 800;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			.ticket-heading-title {
				overflow: hidden;
				color: var(--text-strong);
				font-size: 18px;
				font-weight: 700;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.ticket-status {
				display: inline-flex;
				min-height: 25px;
				align-items: center;
				gap: 6px;
				padding: 3px 9px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgb(255 255 255 / 3%);
				color: var(--text-subtle);
				font-size: 11px;
				font-weight: 700;
				white-space: nowrap;
			}

			.ticket-status::before {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: currentColor;
				content: "";
			}

			.ticket-status[data-status="open"],
			.ticket-status[data-status="in_progress"] {
				border-color: rgb(61 158 96 / 35%);
				background: rgb(61 158 96 / 10%);
				color: #75c995;
			}

			.ticket-status[data-status="closed"] {
				border-color: rgb(201 173 121 / 34%);
				background: rgb(201 173 121 / 9%);
				color: var(--sacra-gold);
			}

			.ticket-status[data-status="pending"] {
				border-color: rgb(218 160 75 / 35%);
				background: rgb(218 160 75 / 9%);
				color: #e3b56b;
			}

			.ticket-meta {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
				gap: 12px 18px;
				padding: 0 20px 17px 74px;
			}

			.ticket-meta-item {
				min-width: 0;
			}

			.ticket-meta-label {
				margin-bottom: 3px;
				color: var(--muted);
				font-size: 10px;
				font-weight: 700;
				letter-spacing: 0.07em;
				text-transform: uppercase;
			}

			.ticket-meta-value {
				overflow-wrap: anywhere;
				color: var(--text);
				font-size: 12px;
				font-weight: 550;
			}

			.ticket-overview-footer {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				padding: 9px 20px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 10px;
			}

			.title-bar.ticket-title-bar .title-icon {
				border-color: rgb(201 173 121 / 35%);
				background: rgb(201 173 121 / 8%);
				color: var(--sacra-gold);
			}

			.messages {
				flex: 1;
				width: min(100%, 1120px);
				margin: 0 auto;
				padding: 20px 20px 56px;
			}

			.date-divider {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 18px 0 10px;
				color: var(--muted);
				font-size: 12px;
				font-weight: 600;
				text-transform: uppercase;
				white-space: nowrap;
			}

			.date-divider::before,
			.date-divider::after {
				height: 1px;
				flex: 1;
				background: var(--line);
				content: "";
			}

			.message {
				position: relative;
				display: block;
				padding: 3px 16px;
				border-radius: 9px;
				transition: background-color 120ms ease;
			}

			.message-content-row {
				position: relative;
				display: flex;
				min-width: 0;
				padding-left: 56px;
			}

			.message.first-in-group {
				margin-top: 14px;
			}

			.message:hover {
				background: var(--surface-hover);
			}

			.message.first-in-group .compact-time,
			.message.filter-match .compact-time {
				display: none;
			}

			.filter-author {
				display: none;
				min-height: 22px;
				align-items: center;
				gap: 8px;
				margin-bottom: 2px;
				color: var(--text-strong);
				font-size: 14px;
				font-weight: 500;
			}

			.filter-author time {
				color: var(--muted);
				font-size: 12px;
				font-weight: 400;
			}

			.message.filter-match .filter-author {
				display: flex;
			}

			.avatar-slot {
				position: absolute;
				top: 2px;
				left: 0;
				width: 40px;
				height: 40px;
			}

			.avatar {
				display: block;
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: var(--surface-raised);
				object-fit: cover;
			}

			.message-body {
				min-width: 0;
				flex: 1;
			}

			.message-profile {
				display: flex;
				min-height: 22px;
				align-items: center;
				flex-wrap: wrap;
				gap: 5px 7px;
				margin-bottom: 2px;
			}

			.bot-tag {
				display: inline-flex;
				min-height: 16px;
				align-items: center;
				padding: 0 5px;
				border-radius: 4px;
				background: #5865f2;
				color: #ffffff;
				font-size: 10px;
				font-weight: 800;
				letter-spacing: 0.015em;
				line-height: 16px;
				text-transform: uppercase;
				white-space: nowrap;
				user-select: none;
			}

			.message-name {
				color: var(--name-color, var(--text-strong));
				font-size: 16px;
				font-weight: 500;
			}

			.message-name:hover {
				text-decoration: underline;
				text-underline-offset: 2px;
			}

			.message-name.role-gradient {
				background-image: linear-gradient(
					90deg,
					var(--gradient-start),
					var(--gradient-end),
					var(--gradient-start)
				);
				background-size: 220% 100%;
				background-clip: text;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			.message-name.role-gradient:hover {
				animation: role-shine 1.4s linear infinite;
				filter: drop-shadow(
					0 0 5px
						color-mix(in srgb, var(--gradient-end) 55%, transparent)
				);
				text-decoration-color: var(--gradient-end);
			}

			@keyframes role-shine {
				to {
					background-position: 220% 0;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.message-name.role-gradient:hover {
					animation: none;
				}
			}

			.message-time,
			.compact-time {
				color: var(--muted);
				font-size: 12px;
			}

			.compact-time {
				position: absolute;
				top: 3px;
				left: 0;
				width: 42px;
				text-align: center;
				opacity: 0;
			}

			.message:not(.first-in-group):hover .compact-time {
				opacity: 1;
			}

			.component-button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				cursor: pointer;
				text-decoration: none;
			}

			.message-content {
				color: var(--text);
				font-size: 16px;
				line-height: 1.375;
				overflow-wrap: anywhere;
				white-space: pre-wrap;
			}

			.reply-reference {
				display: grid;
				width: 100%;
				max-width: 100%;
				grid-template-columns: 0 auto minmax(0, 1fr);
				grid-template-rows: 20px;
				align-items: center;
				column-gap: 4px;
				margin: 0 0 2px;
				padding-left: 56px;
			}

			.reply-spine {
				position: relative;
				grid-column: 1;
				grid-row: 1;
				width: 24px;
				padding: 0;
				border: 0;
				background: transparent;
				cursor: default;
			}

			button.reply-spine,
			button.reply-preview {
				cursor: pointer;
			}

			.reply-spine::before {
				position: absolute;
				top: -4px;
				right: 25px;
				width: 35px;
				height: 14px;
				border-top: 2px solid var(--text-muted, var(--muted));
				border-left: 2px solid var(--text-muted, var(--muted));
				border-top-left-radius: 6px;
				content: "";
			}

			.reply-spine::after {
				position: absolute;
				top: 8px;
				bottom: 0;
				right: 25px;
				border-left: 2px solid var(--text-muted, var(--muted));
				content: "";
			}

			.reply-reference:hover .reply-spine::before,
			.reply-reference:hover .reply-spine::after {
				border-color: var(--text-subtle);
			}

			.reply-header {
				display: flex;
				min-width: 0;
				grid-column: 2;
				grid-row: 1;
				align-items: center;
				gap: 4px;
				overflow: hidden;
				max-width: 100%;
				color: var(--muted);
				font-size: 12px;
				line-height: 20px;
				white-space: nowrap;
			}

			.reply-avatar {
				width: 20px;
				height: 20px;
				flex: 0 0 20px;
				border-radius: 50%;
				object-fit: cover;
			}

			.reply-name {
				max-width: 200px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.message-name.reply-name {
				color: var(--name-color, var(--text-strong));
				font-size: 12px;
				font-weight: 500;
			}

			a.reply-name {
				text-decoration: none;
			}

			a.reply-name:hover {
				text-decoration: underline;
			}

			.reply-snippet {
				display: block;
				min-width: 0;
				grid-column: 3;
				grid-row: 1;
				overflow: hidden;
				color: var(--text-subtle);
				font-size: 14px;
				line-height: 20px;
				text-overflow: ellipsis;
				white-space: nowrap;
				text-align: left;
			}

			button.reply-preview {
				min-width: 0;
				padding: 0;
				border: 0;
				background: transparent;
				font: inherit;
			}

			.reply-preview:hover .reply-snippet {
				color: var(--text);
			}

			.reply-reference.unresolved {
				cursor: default;
			}

			.message.reply-target-highlight {
				background: rgb(88 101 242 / 16.1%);
			}

			.message.reply-target-highlight:hover {
				background: rgb(88 101 242 / 12.2%);
			}

			.mention {
				display: inline;
				padding: 0 2px;
				border-radius: 3px;
				background: var(--mention-background);
				color: var(--mention-foreground);
				font-weight: 500;
				text-decoration: none;
				white-space: nowrap;
			}

			a.mention:hover {
				background: #5865f2;
				color: #ffffff;
			}

			.mention:focus-visible,
			.reply-spine:focus-visible,
			.reply-preview:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}

			.mention-role {
				font-weight: 500;
			}

			.mention-role-colored {
				background: color-mix(
					in srgb,
					var(--mention-role-color) 20%,
					transparent
				);
				color: var(--mention-role-color);
			}

			.discord-code {
				padding: 1px 4px;
				border-radius: 3px;
				background: var(--surface);
				font-family: Consolas, "Courier New", monospace;
				font-size: 0.9em;
			}

			.discord-emoji {
				display: inline-block;
				width: 1.25em;
				height: 1.25em;
				margin: 0 0.04em;
				vertical-align: -0.25em;
				object-fit: contain;
			}

			.discord-heading {
				display: block;
				margin: 0;
				color: var(--text-strong);
				font-weight: 700;
				line-height: 1.25;
			}

			.discord-heading-1 {
				font-size: 1.35em;
			}

			.discord-heading-2 {
				font-size: 1.2em;
			}

			.discord-heading-3 {
				font-size: 1.08em;
			}

			.discord-subtext {
				display: block;
				color: var(--muted);
				font-size: 0.85em;
				line-height: 1.35;
			}

			.discord-list {
				margin: 0;
				padding-left: 1.5em;
			}

			.discord-list li {
				padding-left: 0.1em;
			}

			.message.edited .message-content::after {
				margin-left: 4px;
				color: var(--muted);
				font-size: 10px;
				content: "(editada)";
			}

			.deleted-label {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				margin: 0 0 4px;
				color: var(--danger);
				font-size: 12px;
			}

			.reactions {
				display: inline-flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 4px;
			}

			.member-tag {
				display: inline-flex;
				min-height: 20px;
				align-items: center;
				gap: 4px;
				padding: 2px 6px;
				border: 1px solid
					color-mix(
						in srgb,
						var(--tag-color, var(--accent)) 45%,
						transparent
					);
				border-radius: 6px;
				background: color-mix(
					in srgb,
					var(--tag-color, var(--accent)) 24%,
					#000
				);
				color: var(--text-strong);
				font-size: 11px;
				font-weight: 700;
				line-height: 14px;
				white-space: nowrap;
			}

			.member-tag-icon,
			.role-icon {
				display: block;
				width: 16px;
				height: 16px;
				flex: 0 0 16px;
				object-fit: contain;
			}

			.role-icon {
				border-radius: 3px;
			}

			.role-icon-emoji {
				display: inline-flex;
				width: 16px;
				height: 16px;
				flex: 0 0 16px;
				align-items: center;
				justify-content: center;
				font-size: 14px;
				line-height: 1;
			}

			.role-icon-emoji .discord-emoji {
				width: 16px;
				height: 16px;
				margin: 0;
				vertical-align: middle;
			}

			.reactions {
				display: flex;
				margin-top: 6px;
			}

			.reaction {
				display: inline-flex;
				min-height: 32px;
				align-items: center;
				padding: 2px 8px;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: var(--surface-raised);
				color: var(--text);
				font-size: 13px;
			}

			.reaction.me {

		<script>
			const exportInfo = JSON.parse(

			);
			const messages = JSON.parse(

			const messagesElement = document.querySelector("#messages");
			const messageRows = [];
			let filterEmptyState = null;
			let highlightTimer = 0;
			let scrollEndHandler = null;
			const emojiSegmenter =
				typeof Intl.Segmenter === "function"
					? new Intl.Segmenter("pt-BR", {
							granularity: "grapheme",
						})
					: null;
			const emojiPattern =
				/[\p{Extended_Pictographic}\p{Emoji_Presentation}]|\p{Regional_Indicator}{2}|\u20e3/u;
			const twemojiBaseUrl =
				"https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/";
			const dateFormatter = new Intl.DateTimeFormat("pt-BR", {
				day: "numeric",
				month: "long",
				year: "numeric",
			});
			const timeFormatter = new Intl.DateTimeFormat("pt-BR", {
				hour: "2-digit",
				minute: "2-digit",
			});

			function normalizeSearch(value) {
				return String(value || "")
					.normalize("NFD")
					.replace(/[\u0300-\u036f]/g, "")
					.toLocaleLowerCase("pt-BR")
					.trim();
			}

			function updateMessageFilters() {
				const search = document.querySelector("#message-search");
				const authorFilter = document.querySelector("#author-filter");
				const resultsCount = document.querySelector("#results-count");
				const clearSearch = document.querySelector("#clear-search");
				const jumpLatest = document.querySelector("#jump-latest");
				const query = normalizeSearch(search.value);
				const authorId = authorFilter.value;
				const isFiltering = Boolean(query || authorId);
				let visibleCount = 0;

				for (const row of messageRows) {
					const matches =
						(!query || row.dataset.search.includes(query)) &&
						(!authorId || row.dataset.authorId === authorId);
					row.hidden = !matches;
					row.setAttribute("aria-hidden", String(!matches));
					row.classList.toggle(
						"filter-match",
						isFiltering && matches,
					);
					if (matches) visibleCount++;
				}

				for (const divider of messagesElement.querySelectorAll(
					".date-divider",
				)) {
					let sibling = divider.nextElementSibling;
					let hasVisibleMessage = false;
					while (
						sibling &&
						!sibling.classList.contains("date-divider")
					) {
						if (
							sibling.classList.contains("message") &&
							!sibling.hidden
						) {
							hasVisibleMessage = true;
							break;
						}
						sibling = sibling.nextElementSibling;
					}
					divider.hidden = !hasVisibleMessage;
				}

				if (filterEmptyState) {
					filterEmptyState.hidden = visibleCount > 0;
					filterEmptyState.textContent =
						isFiltering && messageRows.length > 0
							? "Nenhuma mensagem encontrada com esses filtros."
							: "Nenhuma mensagem para exibir.";
				}
				resultsCount.textContent = isFiltering
					? `${visibleCount} de ${messageRows.length} mensagens`
					: `${messageRows.length} mensagens`;
				clearSearch.hidden = search.value.length === 0;
				jumpLatest.disabled = visibleCount === 0;
			}

			function element(tag, className, text) {
				const node = document.createElement(tag);
				if (className) node.className = className;
				if (text !== undefined) node.textContent = text;
				return node;
			}

			function appendDiscordText(parent, text, metadata = {}) {
				const lines = String(text).split("\n");
				let list = null;
				for (const [index, line] of lines.entries()) {
					const heading = line.match(/^(#{1,3})[ \t]+(.*)$/);
					const subtext = line.match(/^-#[ \t]+(.*)$/);
					const listItem = line.match(/^-[ \t]+(.*)$/);
					if (listItem) {
						if (!list) {
							list = element("ul", "discord-list");
							parent.append(list);
						}
						const item = element("li");
						appendInlineDiscordText(item, listItem[1], metadata);
						list.append(item);
						continue;
					}

					list = null;
					if (heading) {
						const level = heading[1].length;
						const title = element(
							`h${level}`,
							`discord-heading discord-heading-${level}`,
						);
						appendInlineDiscordText(title, heading[2], metadata);
						parent.append(title);
					} else if (subtext) {
						const note = element("small", "discord-subtext");
						appendInlineDiscordText(note, subtext[1], metadata);
						parent.append(note);
					} else {
						const lineElement = element("span", "discord-line");
						appendInlineDiscordText(lineElement, line, metadata);
						parent.append(lineElement);
						if (index < lines.length - 1)
							parent.append(document.createElement("br"));
					}
				}
			}

			function appendInlineDiscordText(parent, text, metadata = {}) {
				const pattern =
					/\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|`([^`\n]+)`|\*([^*\n]+)\*|_([^_\n]+)_/g;
				let cursor = 0;
				let match;

				while ((match = pattern.exec(text)) !== null) {
					appendPlainText(
						parent,
						text.slice(cursor, match.index),
						metadata,
					);
					const tag =
						match[1] !== undefined
							? "strong"
							: match[2] !== undefined
								? "u"
								: match[3] !== undefined
									? "s"
									: match[4] !== undefined
										? "code"
										: "em";

					for (const item of component.items || children) {
						const url = safeUrl(item?.url || item?.media?.url);
						if (!url) continue;
						const image = element("img", "component-media");
						image.src = url;
						image.alt = item.description || "";
						image.loading = "lazy";
						gallery.append(image);
					}
					return gallery.childElementCount ? gallery : null;
				}
				if (kind === "file") {
					const url = safeUrl(component.url || component.file?.url);
					if (!url) return null;
					const link = element(
						"a",
						"component-file",
						component.name || component.file?.name || "Arquivo",
					);
					link.href = url;
					link.target = "_blank";
					link.rel = "noopener noreferrer";
					return link;
				}
				if (kind === "button") {
					const styles = {
						1: "primary",
						2: "secondary",
						3: "success",
						4: "danger",
						5: "link",
						6: "premium",
					};
					const style =
						styles[component.style] ||
						(typeof component.style === "string"
							? component.style
							: "secondary");
					if (style === "link" && safeUrl(component.url)) {
								const link = element(
									"a",
									`component-button ${style}`,
								);
								appendComponentLabel(
									link,
									component,
									"Abrir link",
								);
								link.href = safeUrl(component.url);
								link.target = "_blank";
								link.rel = "noopener noreferrer";
								appendLaunchIcon(link);
								return link;
							}
							const button = element(
								"button",
								`component-button ${style}`,
					);
							appendComponentLabel(button, component, "Botão");
					button.type = "button";
					button.disabled = true;
					button.title =
						"Componente arquivado; interação indisponível";
					button.setAttribute(
						"aria-label",
						component.label || "Botão arquivado",
					);
					return button;
				}
				if (kind.endsWith("_select") || kind === "select") {
					const wrapper = element("div", "component-select");
					wrapper.append(
						element(
							"div",
							"component-select-placeholder",
							component.placeholder || "Menu de seleção",
						),
					);
					const options = Array.isArray(component.options)
						? component.options
						: [];
					if (options.length) {
						const list = element("ul", "component-options");
						for (const option of options) {
							const li = element("li");
							if (option.emoji) {
								appendEmojiImage(
									li,
									option.emoji,
									emojiFallback(option.emoji),
								);
								li.append(document.createTextNode(" "));
							}
							li.append(
								document.createTextNode(
									option.label || option.value || "Opção",
								),
							);
							if (option.description)
								li.append(
									element("small", "", option.description),
								);
							list.append(li);
						}
						wrapper.append(list);
					} else
						wrapper.append(
							element(
								"small",
								"",
								"Opções não disponíveis nesta exportação.",
							),
						);
					return wrapper;
				}
				if (kind === "row" || kind === "action_row") {
					const row = element("div", "component-row");
					for (const child of children) {
						const rendered = renderComponent(child, depth + 1);
						if (rendered) row.append(rendered);
					}
					return row;
				}
				if (children.length) {
					const group = element("div", "components");
					for (const child of children) {
						const rendered = renderComponent(child, depth + 1);
						if (rendered) group.append(rendered);
					}
					return group;
				}
				return null;
			}

			function appendComponents(parent, components) {
				if (!components) return;
				const root = Array.isArray(components)
					? { type: "layout", children: components }
					: components;
				const rendered = renderComponent(root);
				if (rendered) {
					rendered.classList.add("components");
					parent.append(rendered);
				}
			}

			function appendReactions(parent, reactions) {
				if (!Array.isArray(reactions) || reactions.length === 0) return;
				const group = element("div", "reactions");
				for (const reaction of reactions) {
					if (!reaction || !Number.isFinite(reaction.count)) continue;
					const emoji = reaction.emoji;
					const label =
						typeof emoji === "string"
							? emoji
							: emoji?.name || "emoji";
					const chip = element(
						"span",
						`reaction${reaction.me ? " me" : ""}`,
					);
					appendEmojiImage(chip, emoji, label);
					chip.append(document.createTextNode(` ${reaction.count}`));
					if (reaction.me) chip.title = "Você reagiu";
					group.append(chip);
				}
				if (group.childElementCount > 0) parent.append(group);
			}

			function appendAttachments(parent, attachments) {
				if (!Array.isArray(attachments) || !attachments.length) return;
				const group = element("div", "attachments");
				for (const file of attachments) {
					if (!file || typeof file !== "object") continue;
					const url = safeUrl(file.url || file.proxy_url);
					if (!url) continue;
					const type = String(file.content_type || "");
					if (type.startsWith("image/")) {
						const link = element("a", "attachment");
						link.href = url;
						link.target = "_blank";
						link.rel = "noopener noreferrer";
						appendImage(
							link,
							url,
							"",
							file.description ||
								file.filename ||
								"Imagem anexada",
						);
						link.append(
							document.createTextNode(file.filename || "Imagem"),
						);
						group.append(link);
					} else {
						const link = element(
							"a",
							"attachment",
							`${file.filename || "Arquivo"}${Number.isFinite(file.size) ? ` · ${(file.size / 1024).toFixed(1)} KB` : ""}`,
						);
						link.href = url;
						link.target = "_blank";
						link.rel = "noopener noreferrer";
						group.append(link);
					}
				}
				if (group.childElementCount) parent.append(group);
			}

			function renderMessage(message, user, firstInGroup, warnings) {
				const hasReply = Boolean(replyId(message));
				const row = element(
					"article",
					`message${firstInGroup ? " first-in-group" : ""}${hasReply ? " has-reply" : ""}${message.deleted ? " deleted" : ""}${message.edited || message.edited_timestamp ? " edited" : ""}`,
				);
				if (message.id !== undefined && message.id !== null) {
					row.dataset.messageId = String(message.id);
					row.id = `message-${encodeURIComponent(String(message.id))}`;
				}

				const avatarSlot = element("div", "avatar-slot");
				if (firstInGroup) {
					avatarSlot.append(createAvatar(user));
				} else {
					const compact = element(
						"time",
						"compact-time",
						timeFormatter.format(
							new Date(messageTimestamp(message)),
						),
					);
					compact.dateTime = messageTimestamp(message);
					avatarSlot.append(compact);
				}
				const contentRow = element("div", "message-content-row");
				contentRow.append(avatarSlot);

				const body = element("div", "message-body");
				if (firstInGroup) {
					const profile = element("div", "message-profile");
					profile.dataset.timestamp = messageTimestamp(message);
					appendIdentity(profile, user, warnings);
					body.append(profile);
				} else {
					const filterAuthor = element("div", "filter-author");
					filterAuthor.append(
						element("span", "", user.name),
						element(
							"time",
							"",
							timeFormatter.format(
								new Date(messageTimestamp(message)),
							),
						),
					);
					filterAuthor.lastElementChild.dateTime =
						messageTimestamp(message);
					body.append(filterAuthor);
				}

				if (message.deleted)
					body.append(
						element("div", "deleted-label", "Mensagem excluída"),
					);
				if (typeof message.content === "string" && message.content) {
					body.append(
						formattedElement(
							"message-content",
							message.content,
							message.mentionData,
						),
					);
				}
				for (const embed of Array.isArray(message.embeds)
					? message.embeds
					: [])
					appendEmbed(body, embed);
				appendAttachments(body, message.attachments);
				appendComponents(body, message.components);
				appendReactions(body, message.reactions);
				contentRow.append(body);
				row.append(contentRow);
				return { row, body };
			}

			function replyId(message) {
				if (
					typeof message.replyTo === "string" ||
					typeof message.replyTo === "number"
				) {
					return String(message.replyTo);
				}
				const reference = message.replyTo || message.message_reference;
				if (
					reference &&
					(typeof reference.id === "string" ||
						typeof reference.id === "number")
				)
					return String(reference.id);
				return "";
			}

			function jumpToMessage(targetRow) {
				const reduceMotion = window.matchMedia(
					"(prefers-reduced-motion: reduce)",
				).matches;
				if (highlightTimer) window.clearTimeout(highlightTimer);
				if (scrollEndHandler) {
					window.removeEventListener("scrollend", scrollEndHandler);
					scrollEndHandler = null;
				}
				document
					.querySelectorAll(".reply-target-highlight")
					.forEach((item) =>
						item.classList.remove("reply-target-highlight"),
					);

				const targetRect = targetRow.getBoundingClientRect();
				const maxScroll =
					document.documentElement.scrollHeight - window.innerHeight;
				const targetScroll = Math.max(
					0,
					Math.min(
						maxScroll,
						targetRect.top +
							window.scrollY +
							targetRect.height / 2 -
							window.innerHeight / 2,
					),
				);
				const scrollDistance = Math.abs(targetScroll - window.scrollY);
				window.scrollTo({
					top: targetScroll,
					behavior: reduceMotion ? "auto" : "smooth",
				});

				const highlightTarget = () => {
					if (highlightTimer) window.clearTimeout(highlightTimer);
					if (scrollEndHandler) {
						window.removeEventListener(
							"scrollend",
							scrollEndHandler,
						);
						scrollEndHandler = null;
					}
					targetRow.classList.add("reply-target-highlight");
					highlightTimer = window.setTimeout(
						() =>
							targetRow.classList.remove(
								"reply-target-highlight",
							),
						1800,
					);
				};

				if (reduceMotion || scrollDistance < 1) {
					highlightTarget();
					return;
				}
				scrollEndHandler = highlightTarget;
				window.addEventListener("scrollend", scrollEndHandler, {
					once: true,
				});
				highlightTimer = window.setTimeout(highlightTarget, 1400);
			}

			function appendReplyReference(
				row,
				message,
				messagesById,
				rowsById,
			) {
				const id = replyId(message);
				if (!id) return;

				const target =
					messagesById.get(id) ||
					message.referenced_message ||
					message.replyTo?.referenced_message;
				const targetRow = rowsById.get(id);
				const targetUser = target ? getUserForMessage(target) : null;
				const replySnapshot =
					message.replyTo || message.referenced_message || {};
				const label = targetUser
					? targetUser.name
					: replySnapshot.userName ||
						replySnapshot.author?.global_name ||
						replySnapshot.author?.username;
				const targetUserId = targetUser?.id || replySnapshot.user;
				const snippet = target
					? target.deleted
						? "Mensagem excluída"
						: typeof target.content === "string"
							? target.content
							: "Mensagem sem texto"
					: (message.replyTo || message.referenced_message) &&
						  typeof (message.replyTo || message.referenced_message)
								.content === "string"
						? (message.replyTo || message.referenced_message)
								.content
						: "Mensagem não incluída nesta exportação";
				const reference = element(
					"div",
					`reply-reference${targetRow ? "" : " unresolved"}`,
				);
				const spine = element(
					targetRow ? "button" : "span",
					"reply-spine",
				);
				if (targetRow) {
					spine.type = "button";
					spine.setAttribute("aria-label", "Ir para resposta");
					spine.addEventListener("click", () =>
						jumpToMessage(targetRow),
					);
				}
				reference.append(spine);

				const header = element("div", "reply-header");
				if (targetUser) {
					const avatar = createAvatar(targetUser);
					avatar.className = "reply-avatar";
					header.append(avatar);
				} else if (
					replySnapshot.avatar ||
					replySnapshot.author?.avatar_url
				)
					appendImage(
						header,
						replySnapshot.avatar || replySnapshot.author.avatar_url,
						"reply-avatar",
					);
				const replyName = element(
					targetUserId ? "a" : "span",
					"message-name reply-name",
					`@${label || "Mensagem original"}`,
				);
				applyRoleNameStyle(replyName, targetUser?.role);
				if (targetUserId) {
					replyName.href = `https://discord.com/users/${encodeURIComponent(String(targetUserId))}`;
					replyName.target = "_blank";
					replyName.rel = "noopener noreferrer";
				}
				header.append(replyName);
				if (targetUser) {
					appendBotBadge(header, targetUser);
					appendServerTag(header, targetUser);
					appendRoleIcon(header, targetUser.role);
				}
				reference.append(header);

				const preview = element(
					targetRow ? "button" : "div",
					"reply-preview",
				);
				if (targetRow) {
					preview.type = "button";
					preview.setAttribute(
						"aria-label",
						`Ir para mensagem de ${label || "usuário"}`,
					);
					preview.addEventListener("click", () =>
						jumpToMessage(targetRow),
					);
				}
				const previewText = element("span", "reply-snippet");
				appendDiscordText(
					previewText,
					snippet,
					target?.mentionData || {},
				);
				preview.append(previewText);
				reference.append(preview);
				row.insertBefore(
					reference,
					row.querySelector(".message-content-row"),
				);
			}

			function renderMessages() {
				const warnings = [];
				let previousMessage = null;
				let previousDate = "";
				const messagesById = new Map();
				const rowsById = new Map();
				const rendered = [];

				for (const message of messages) {
					if (
						message &&
						message.id !== undefined &&
						message.id !== null
					) {
						const id = String(message.id);
						if (messagesById.has(id)) {
							warnings.push(`ID de mensagem duplicado: ${id}.`);
						} else {
							messagesById.set(id, message);
						}
					}
				}

				const orderedMessages = [...messages]
					.filter(Boolean)
					.sort(
						(a, b) =>
							new Date(messageTimestamp(a)).getTime() -
							new Date(messageTimestamp(b)).getTime(),
					);
				for (const [index, message] of orderedMessages.entries()) {
					if (!message || typeof message !== "object") {
						warnings.push(
							`Registro ${index + 1}: formato de mensagem inválido.`,
						);
						continue;
					}
					const user = getUserForMessage(message);
					const date = new Date(messageTimestamp(message));
					if (
						!user.id ||
						!user.name ||
						Number.isNaN(date.getTime())
					) {
						warnings.push(
							`Mensagem ${message.id || index + 1}: autor ou data inválidos.`,
						);
						continue;
					}

					const dateKey = dateFormatter.format(date);
					if (dateKey !== previousDate) {
						messagesElement.append(
							element("div", "date-divider", dateKey),
						);
						previousDate = dateKey;
						previousMessage = null;
					}
					const previousTime = previousMessage
						? new Date(messageTimestamp(previousMessage)).getTime()
						: 0;
					const firstInGroup =
						!previousMessage ||
						Boolean(replyId(message)) ||
						messageAuthorId(previousMessage) !==
							messageAuthorId(message) ||
						date.getTime() - previousTime > 7 * 60 * 1000;

					const renderedMessage = renderMessage(
						message,
						user,
						firstInGroup,
						warnings,
					);
					messagesElement.append(renderedMessage.row);
					if (
						message.id !== undefined &&
						message.id !== null &&
						!rowsById.has(String(message.id))
					) {
						rowsById.set(String(message.id), renderedMessage.row);
					}
					rendered.push({
						row: renderedMessage.row,
						message,
						user,
					});
					previousMessage = message;
				}

				for (const item of rendered) {
					appendReplyReference(
						item.row,
						item.message,
						messagesById,
						rowsById,
					);
					item.row.dataset.authorId = item.user.id;
					item.row.dataset.search = normalizeSearch(
						[
							item.message.content,
							item.user.name,
							item.message.id,
							item.row.textContent,
						].join(" "),
					);
					messageRows.push(item.row);
				}

				const authors = new Map();
				for (const item of rendered) {
					if (!authors.has(item.user.id))
						authors.set(item.user.id, item.user.name);
				}
				const authorFilter = document.querySelector("#author-filter");
				for (const [id, name] of [...authors].sort((a, b) =>
					a[1].localeCompare(b[1], "pt-BR"),
				)) {
					const option = element("option", "", name);
					option.value = id;
					authorFilter.append(option);
				}

				if (warnings.length > 0) {
					const warning = element(
						"div",
						"data-warning",
						`${warnings.length} registro(s) não puderam ser exibidos: ${warnings.join(" ")}`,
					);
					warning.setAttribute("role", "alert");
					messagesElement.prepend(warning);
				}
				filterEmptyState = element(
					"p",
					"empty-state",
					"Nenhuma mensagem para exibir.",
				);
				filterEmptyState.hidden = messageRows.length > 0;
				messagesElement.append(filterEmptyState);
			}

			function ticketData() {
				if (exportInfo.ticketInfo && typeof exportInfo.ticketInfo === "object") return exportInfo.ticketInfo;
				if (exportInfo.ticket && typeof exportInfo.ticket === "object") return exportInfo.ticket;
				return exportInfo;
			}

			function isTicketExport() {
				return exportInfo.type === "ticket" || exportInfo.kind === "ticket" ||
					exportInfo.isTicket === true || Boolean(exportInfo.ticketInfo) ||
					(Boolean(exportInfo.ticket) && typeof exportInfo.ticket === "object");
			}

			function firstTicketValue(...values) {
				for (const value of values) {
					if (value === null || value === undefined || value === "") continue;
					if (typeof value === "object") {
						const nested = value.displayName || value.display_name || value.global_name || value.username || value.name;
						if (nested) return String(nested);
						continue;
					}
					return String(value);
				}
				return "";
			}

			function formatTicketDate(value) {
				if (!value) return "";
				const date = new Date(value);
				if (Number.isNaN(date.getTime())) return String(value);
				return `${dateFormatter.format(date)} · ${timeFormatter.format(date)}`;
			}

			function appendTicketMeta(container, label, value) {
				if (!value) return;
				const item = element("div", "ticket-meta-item");
				item.append(element("div", "ticket-meta-label", label));
				item.append(element("div", "ticket-meta-value", value));
				container.append(item);
			}

			function renderTicketOverview() {
				const panel = document.querySelector("#ticket-overview");
				if (!isTicketExport()) {
					panel.hidden = true;
					return;
				}

				const ticket = ticketData();
				const channelName = firstTicketValue(ticket.channelName, ticket.channel_name, exportInfo.channelName, exportInfo.channel_name);
				const title = firstTicketValue(ticket.title, ticket.name, channelName, "Atendimento");
				const rawStatus = firstTicketValue(ticket.status, ticket.state, exportInfo.status, ticket.closed || exportInfo.closed ? "closed" : "open").toLowerCase();
				const statusKey = /clos|encerr|fech/.test(rawStatus) ? "closed" : /pend|wait|aguard/.test(rawStatus) ? "pending" : /progress|claim|atend|work/.test(rawStatus) ? "in_progress" : "open";
				const statusLabel = statusKey === "closed" ? "Encerrado" : statusKey === "pending" ? "Pendente" : statusKey === "in_progress" ? "Em atendimento" : "Aberto";

				panel.replaceChildren();
				panel.hidden = false;
				const heading = element("div", "ticket-overview-heading");
				heading.append(element("div", "ticket-emblem", "✠"));
				const copy = element("div", "ticket-heading-copy");
				copy.append(element("div", "ticket-kicker", firstTicketValue(ticket.guildName, exportInfo.guildName, "Sacra Communitas").toUpperCase() + " · CENTRAL DE ATENDIMENTO"));
				copy.append(element("div", "ticket-heading-title", title));
				heading.append(copy);
				const status = element("span", "ticket-status", statusLabel);
				status.dataset.status = statusKey;
				heading.append(status);
				panel.append(heading);

				const meta = element("div", "ticket-meta");
				appendTicketMeta(meta, "Solicitante", firstTicketValue(ticket.requesterName, ticket.requester, ticket.openerName, ticket.createdBy, ticket.created_by));
				appendTicketMeta(meta, "Responsável", firstTicketValue(ticket.assigneeName, ticket.assignee, ticket.claimedBy, ticket.claimed_by, ticket.staffName));
				appendTicketMeta(meta, "Categoria", firstTicketValue(ticket.categoryName, ticket.category, ticket.parentName, ticket.parent));
				appendTicketMeta(meta, "Abertura", formatTicketDate(firstTicketValue(ticket.createdAt, ticket.created_at, ticket.openedAt, ticket.opened_at)));
				appendTicketMeta(meta, "Encerramento", formatTicketDate(firstTicketValue(ticket.closedAt, ticket.closed_at, ticket.resolvedAt, ticket.resolved_at)));
				appendTicketMeta(meta, "Identificador", firstTicketValue(ticket.ticketId, ticket.ticket_id, ticket.id, exportInfo.ticketId, exportInfo.ticket_id));
				if (meta.childElementCount) panel.append(meta);

				const footer = element("div", "ticket-overview-footer");
				footer.append(element("span", "", "Sacra Communitas · Registro de atendimento"));
				footer.append(element("span", "", `${messages.length} mensagens preservadas`));
				panel.append(footer);
			}

			function renderTitle() {
				const title = document.querySelector("#export-title");
				const subtitle = document.querySelector("#export-subtitle");
				const icon = document.querySelector("#title-icon");
				const titleBar = document.querySelector(".title-bar");
				if (isTicketExport()) {
					const ticket = ticketData();
					title.textContent = firstTicketValue(ticket.channelName, ticket.channel_name, ticket.title, ticket.name, exportInfo.channelName, "Atendimento");
					icon.textContent = "✠";
					subtitle.textContent = `${firstTicketValue(ticket.guildName, exportInfo.guildName, "Sacra Communitas")} · Registro de atendimento · ${messages.length} mensagens`;
					titleBar.classList.add("ticket-title-bar");
					renderTicketOverview();
				} else if (exportInfo.type === "user") {
					titleBar.classList.remove("ticket-title-bar");
					const userName = exportInfo.userName || "Usuário";
					title.textContent = `Mensagens de ${userName}`;
					icon.textContent = "@";
					subtitle.textContent = "Exportação de conversa";
				} else if (exportInfo.type === "bulk") {
					titleBar.classList.remove("ticket-title-bar");
					title.textContent =
						exportInfo.title || "Exportação de mensagens";
					icon.textContent = "≡";
					subtitle.textContent = `${messages.length} mensagens exportadas · exportação em lote`;
				} else {
					titleBar.classList.remove("ticket-title-bar");
					const channelName = exportInfo.channelName || "canal";
					title.textContent = channelName;
					icon.textContent = "#";
					subtitle.textContent = `${messages.length} mensagens`;
				}
				document.title = `${title.textContent} — Exportação`;
			}

			function setupMessageControls() {
				const search = document.querySelector("#message-search");
				const authorFilter = document.querySelector("#author-filter");
				const clearSearch = document.querySelector("#clear-search");
				const jumpLatest = document.querySelector("#jump-latest");

				search.addEventListener("input", updateMessageFilters);
				authorFilter.addEventListener("change", updateMessageFilters);
				clearSearch.addEventListener("click", () => {
					search.value = "";
					updateMessageFilters();
					search.focus();
				});
				jumpLatest.addEventListener("click", () => {
					const latestVisible = [...messageRows]
						.reverse()
						.find((row) => !row.hidden);
					if (latestVisible) jumpToMessage(latestVisible);
				});
				document.addEventListener("keydown", (event) => {
					const target = event.target;
					const isEditing =
						target instanceof HTMLElement &&
						(target.isContentEditable ||
							["INPUT", "SELECT", "TEXTAREA"].includes(
								target.tagName,
							));
					if (event.key === "/" && !isEditing) {
						event.preventDefault();
						search.focus();
					} else if (event.key === "Escape" && search.value) {
						search.value = "";
						updateMessageFilters();
					}
				});
				updateMessageFilters();
			}

			renderTitle();
			renderMessages();
			setupMessageControls();
		</script>
	</body>
</html>
